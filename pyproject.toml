[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dream-mcp"
version = "0.1.0"
description = "MCP server for DreamFX and DreamShader - routes AI tooling to a warm Unreal editor, or falls back to the CLI"
requires-python = ">=3.10"
dependencies = [
    # Pinned below 2 for the same reason renderdoc-mcp is: the fastmcp import
    # surface moved, and an unpinned install silently picks up the break.
    "mcp[cli]>=1.0.0,<2",
]

[project.scripts]
dream-mcp = "dream_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dream_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
